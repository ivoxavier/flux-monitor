version: '3.8'

services:
  # OPTION A (DEFAULT): MySQL
  flux-monitor-db:
    image: mysql:8.0
    container_name: flux-monitor-db-mysql
    restart: always
    env_file:
      - .env.local
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER:-flux_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - flux_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OPTION B: PostgreSQL (Uncomment this block and the API healthcheck condition if you want to use it)
  # flux-monitor-db:
  #   image: postgres:16-alpine
  #   container_name: flux-monitor-db-postgres
  #   restart: always
  #   env_file:
  #     - .env.local
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-flux_admin}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_DATABASE}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - flux_postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flux_admin} -d ${DB_DATABASE}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # OPTION C: SQL Server (Uncomment this block if you want to use it)
  # flux-monitor-db:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: flux-monitor-db-sqlserver
  #   restart: always
  #   env_file:
  #     - .env.local
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - MSSQL_SA_PASSWORD=${ROOT_DB_PASSWORD}
  #     - MSSQL_PID=Developer
  #   ports:
  #     - "1433:1433"

  # Back-end: .NET Web API
  flux-monitor-api:
    image: fluxmonitor-api:latest
    container_name: flux-monitor-api
    restart: always
    build:
      context: ./back-end
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      
      # Environment variable for your API to detect the active provider (Suggested values: MySql, PostgreSql, SqlServer)
      - DatabaseProvider=MySql
      
      # Inject JWT KEY dynamically from .env.local
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=FluxMonitorApi
      - Jwt__Audience=FluxMonitorFrontend


      # CONNECTION STRINGS CONFIGURATION (Uses the variables mapped in your .env.local):
      # Active (MySQL):
      - ConnectionStrings__DefaultConnection=Server=flux-monitor-db;Database=${DB_DATABASE};Uid=${DB_USER:-flux_admin};Pwd=${DB_PASSWORD};
      
      # Alternative (PostgreSQL):
      # - ConnectionStrings__DefaultConnection=Host=flux-monitor-db;Database=${DB_DATABASE};Username=${DB_USER:-flux_admin};Password=${DB_PASSWORD};
      
      # Alternative (SQL Server):
      # - ConnectionStrings__DefaultConnection=Server=flux-monitor-db;Database=master;User Id=sa;Password=${ROOT_DB_PASSWORD};TrustServerCertificate=True;
    ports:
      - "5001:8080"
    depends_on:
      flux-monitor-db:
        condition: service_healthy

  # Front-end: Web Application
  flux-monitor-frontend:
    image: fluxmonitor-frontend:latest
    container_name: flux-monitor-frontend
    restart: always
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - flux-monitor-api

volumes:
  flux_mysql_data:
  # flux_postgres_data: # Uncomment if using PostgreSQL